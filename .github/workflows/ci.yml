name: CI and GitHub Pages

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate deterministic performance contracts
        run: npm run test:performance

      - name: Prepare main baseline
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/last-line-main-performance"
          git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          git worktree add --detach "$baseline" "origin/${{ github.base_ref }}"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline/node_modules"
          printf 'PERFORMANCE_BASELINE=%s\n' "$baseline" >> "$GITHUB_ENV"

      - name: Build performance artifacts
        shell: bash
        run: |
          set -euo pipefail
          repositories=("$GITHUB_WORKSPACE")
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            repositories=("$PERFORMANCE_BASELINE" "$GITHUB_WORKSPACE")
          fi
          for repository in "${repositories[@]}"; do
            (
              cd "$repository"
              npm run build
              npm run build:worker
              npm run build:server
            )
          done

      - name: Compare runtime performance with main
        if: github.event_name == 'pull_request'
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: >-
          npm run check:performance --
          --baseline "$PERFORMANCE_BASELINE"
          --candidate "$GITHUB_WORKSPACE"
          --rounds 3
          --output "$RUNNER_TEMP/performance-report.json"

      - name: Capture main runtime performance baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: >-
          npm run check:performance --
          --mode baseline
          --candidate "$GITHUB_WORKSPACE"
          --rounds 3
          --output "$RUNNER_TEMP/performance-report.json"

      - name: Publish performance summary
        if: always()
        shell: bash
        run: |
          report="$RUNNER_TEMP/performance-report.md"
          if [[ -f "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-performance-comparison
          path: |
            ${{ runner.temp }}/performance-report.json
            ${{ runner.temp }}/performance-report.md
          if-no-files-found: warn
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve application version
        id: app-version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(git describe --tags --always)"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Validate deterministic performance contracts
        run: npm run test:performance

      - name: Build
        env:
          APP_VERSION: ${{ steps.app-version.outputs.version }}
          VITE_MULTIPLAYER_ENABLED: "false"
          VITE_MULTIPLAYER_URL: ""
        run: npm run build

      - name: Build Worker
        run: npm run build:worker

      - name: Build standalone server
        run: npm run build:server

      - name: Check performance budgets
        run: npm run check:budgets

      - name: Build Docker image
        env:
          APP_VERSION: ${{ steps.app-version.outputs.version }}
        run: docker build --build-arg "APP_VERSION=$APP_VERSION" --tag "last-line-ci:${GITHUB_SHA}" .

      - name: Smoke test Docker image
        env:
          CONTAINER_NAME: last-line-ci-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            status=$?
            trap - EXIT
            if [[ "$status" -ne 0 ]]; then
              printf 'Docker smoke test failed; container logs:\n' >&2
              docker logs "$CONTAINER_NAME" >&2 || true
            fi
            docker rm --force "$CONTAINER_NAME" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$CONTAINER_NAME" \
            --init \
            --read-only \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777 \
            --tmpfs /data:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0700 \
            --publish "127.0.0.1::8787" \
            "last-line-ci:${GITHUB_SHA}"

          port_binding="$(docker port "$CONTAINER_NAME" 8787/tcp)"
          [[ "$port_binding" == 127.0.0.1:* ]]
          host_port="${port_binding##*:}"
          [[ "$host_port" =~ ^[0-9]+$ ]]

          health_json=""
          health_ready=false
          for attempt in {1..30}; do
            if health_json="$(curl --fail --silent --show-error "http://127.0.0.1:${host_port}/health" 2>/dev/null)"; then
              health_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$health_ready" != true ]]; then
            printf 'Health endpoint did not become ready\n' >&2
            exit 1
          fi
          if [[ "$health_json" != '{"ok":true,"service":"lastlinep2p"}' ]]; then
            printf 'Unexpected health response: %s\n' "$health_json" >&2
            exit 1
          fi

      - name: Clean up Docker smoke container
        if: always()
        env:
          CONTAINER_NAME: last-line-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$CONTAINER_NAME" >/dev/null 2>&1 || true

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Package release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        run: zip -r "last-line-${GITHUB_REF_NAME}.zip" dist

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: last-line-${{ github.ref_name }}.zip
          if-no-files-found: error
          retention-days: 1

  deploy-github-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-docker-image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Docker image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: docker.io/chenxuan520/last-line
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: |
            latest=auto

      - name: Validate release tag
        env:
          RELEASE_TAGS: ${{ steps.metadata.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == *+* ]]; then
            printf 'Docker image release tags must not include SemVer build metadata: %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ -z "$RELEASE_TAGS" ]]; then
            printf 'Docker image tags must use valid semantic version syntax: %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=docker-release
          cache-to: type=gha,mode=max,scope=docker-release

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, publish-docker-image]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: release-dist

      - name: Create GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "release-dist/last-line-${GITHUB_REF_NAME}.zip" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
